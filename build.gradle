plugins {
	id 'com.unascribed.nilgradle' version '1.4.8'
}

java {
	// You can change this to be higher if you like. NilLoader itself is compiled
	// for Java 8 for compatibility with older versions.
	toolchain {
		languageVersion = JavaLanguageVersion.of(8)
	}
}

group = 'de.femtopedia'
version = project.findProperty('version')
version = version == null || version == 'unspecified' ? '1.0' : version

base {
	archivesName = 'MC147J8'
}

repositories {
	mavenCentral()
	maven {
		url = 'https://repo.sleeping.town'
		content {
			includeGroup 'com.unascribed'
		}
	}
	maven {
		url = 'https://maven.minecraftforge.net'
		metadataSources {
			artifact()
		}
		content {
			includeGroup 'net.minecraftforge'
		}
	}
}

nil {
	id "mc147j8"
	// Set this to false for a smaller JAR that can't be run as a standalone Java agent
	standalone false
}

dependencies {
	loader 'com.unascribed:nilloader:1.3.6'

	game nil.minecraft('1.4.7', 'client')

	jarmod 'net.minecraftforge:forge:1.2.5-3.4.9.171:client@zip'
}

mappings {
	work nil.mcpArchive('1.4.7', '726a')
}
